<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8a24a" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#e8a24a" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#e8a24a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vinyl" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1b1c21"/>
      <stop offset="1" stop-color="#0f1013"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="0.65" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect width="1600" height="560"/></clipPath>
  </defs>

  <rect width="1600" height="560" fill="#0e0f12"/>
  <g clip-path="url(#c)">
    <circle cx="1270" cy="280" r="420" fill="url(#glow)"/>
    <circle cx="1270" cy="280" r="300" fill="url(#vinyl)" stroke="#23252c"/>
    <g fill="none" stroke="#24262d" stroke-width="1">
      <circle cx="1270" cy="280" r="285"/><circle cx="1270" cy="280" r="268"/><circle cx="1270" cy="280" r="252"/>
      <circle cx="1270" cy="280" r="236"/><circle cx="1270" cy="280" r="221"/><circle cx="1270" cy="280" r="205"/>
      <circle cx="1270" cy="280" r="190"/><circle cx="1270" cy="280" r="174"/><circle cx="1270" cy="280" r="158"/>
      <circle cx="1270" cy="280" r="142"/><circle cx="1270" cy="280" r="126"/>
    </g>
    <circle cx="1270" cy="280" r="300" fill="url(#sheen)"/>
    <circle cx="1270" cy="280" r="98" fill="#e8a24a"/>
    <circle cx="1270" cy="280" r="98" fill="none" stroke="#000" stroke-opacity="0.15"/>
    <text x="1270" y="256" text-anchor="middle" fill="#1a1206" font-size="30" font-weight="800">B</text>
    <text x="1270" y="318" text-anchor="middle" fill="#3a2a10" font-size="12" font-weight="600" letter-spacing="0.2em">SIDE</text>
    <circle cx="1270" cy="280" r="6" fill="#0e0f12"/>
  </g>

  <text x="96" y="250" fill="#eef0f3" font-size="104" font-weight="800" letter-spacing="-0.03em">B-side</text>
  <text x="100" y="314" fill="#c9ced6" font-size="30" font-weight="500">근거를 달고 오는 디깅 에이전트</text>
  <text x="100" y="364" fill="#8b93a1" font-size="20">밤사이 에이전트가 파고 기록하고, 아침에 당신은 듣고 판단만.</text>
</svg>
