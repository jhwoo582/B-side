<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6f7686"/>
    </marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e8a24a"/>
    </marker>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8a24a" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#e8a24a" stop-opacity="0"/>
    </radialGradient>
    <style>
      .n { fill: #16181d; stroke: #2a2e36; stroke-width: 1; }
      .k { fill: #5b6270; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; }
      .t { fill: #eef0f3; font-size: 22px; font-weight: 600; }
      .s { fill: #8b93a1; font-size: 15px; }
      .h { fill: #8b93a1; font-size: 15px; font-weight: 600; }
      .l { fill: #8b93a1; font-size: 13px; }
      .e { stroke: #6f7686; stroke-width: 1.5; fill: none; }
      .ea { stroke: #e8a24a; stroke-width: 1.8; fill: none; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#0e0f12"/>
  <ellipse cx="840" cy="320" rx="420" ry="260" fill="url(#glow)"/>

  <text x="60" y="84" fill="#eef0f3" font-size="34" font-weight="700">B-side</text>
  <text x="182" y="84" fill="#8b93a1" font-size="18">근거를 달고 오는 디깅 에이전트</text>

  <!-- 밤 -->
  <text x="60" y="160" class="h">밤 — 에이전트가 파고 기록한다</text>

  <rect x="580" y="186" width="530" height="270" rx="18" fill="#e8a24a" fill-opacity="0.035" stroke="#e8a24a" stroke-opacity="0.28" stroke-dasharray="5 6"/>
  <text x="845" y="444" text-anchor="middle" fill="#c9924a" font-size="13">개인 정보 없이, 공개 자료만 다루는 구역</text>

  <rect class="n" x="60" y="250" width="230" height="150" rx="14"/>
  <text class="k" x="84" y="284">01</text>
  <text class="t" x="84" y="318">내 취향</text>
  <text class="s" x="84" y="348">YouTube Music 좋아요</text>
  <text class="s" x="84" y="372">+ 지난밤 고른 방향</text>

  <rect class="n" x="330" y="250" width="210" height="150" rx="14"/>
  <text class="k" x="354" y="284">02</text>
  <text class="t" x="354" y="318">익명화</text>
  <text class="s" x="354" y="348">개인 사정은 지우고</text>
  <text class="s" x="354" y="372">방향만 넘긴다</text>

  <rect x="610" y="250" width="250" height="150" rx="14" fill="#18191e" stroke="#e8a24a" stroke-opacity="0.55"/>
  <text class="k" x="634" y="284">03</text>
  <text class="t" x="634" y="318">리서처</text>
  <text class="s" x="634" y="348">도구를 직접 골라</text>
  <text class="s" x="634" y="372">여러 홉을 파고든다</text>

  <rect class="n" x="890" y="250" width="190" height="150" rx="14"/>
  <text class="k" x="914" y="284">04</text>
  <text class="t" x="914" y="318">검수</text>
  <text class="s" x="914" y="348">인용이 원문에</text>
  <text class="s" x="914" y="372">글자 그대로 있나</text>

  <rect class="n" x="1150" y="250" width="390" height="150" rx="14"/>
  <text class="k" x="1174" y="284">05</text>
  <text class="t" x="1174" y="318">브리프 · 플레이리스트</text>
  <text class="s" x="1174" y="348">후보마다 발견 경로 · 원문 인용 · 출처</text>
  <text class="s" x="1174" y="372">위키에 기록이 쌓인다</text>

  <path class="e" d="M290 325 H326" marker-end="url(#a)"/>
  <path class="ea" d="M540 325 H606" marker-end="url(#ac)"/>
  <path class="e" d="M860 325 H886" marker-end="url(#a)"/>
  <path class="ea" d="M1080 325 H1146" marker-end="url(#ac)"/>
  <text x="1113" y="312" text-anchor="middle" fill="#e8a24a" font-size="13">통과</text>
  <path class="e" d="M985 250 V218 H735 V246" stroke-dasharray="4 5" marker-end="url(#a)"/>
  <text x="860" y="210" text-anchor="middle" class="l">반려되면 다시 조사</text>

  <!-- 아침 -->
  <line x1="60" y1="520" x2="1540" y2="520" stroke="#1f2228"/>
  <text x="60" y="574" class="h">아침 — 사람은 듣고 판단만 한다</text>

  <rect class="n" x="610" y="620" width="470" height="130" rx="14"/>
  <text class="t" x="634" y="666">출처 색인 (RAG)</text>
  <text class="s" x="634" y="698">밤사이 읽은 원문을 모아 두고</text>
  <text class="s" x="634" y="722">질문에 근거로 꺼내 쓴다</text>

  <rect x="1150" y="620" width="390" height="130" rx="14" fill="#18191e" stroke="#e8a24a" stroke-opacity="0.55"/>
  <text class="t" x="1174" y="666">디깅 앱</text>
  <text class="s" x="1174" y="698">디깅 맵에서 LP를 넘겨 듣고</text>
  <text class="s" x="1174" y="722">점원에게 "왜 이걸 골랐어?"</text>

  <path class="e" d="M735 456 V616" stroke-dasharray="4 5" marker-end="url(#a)"/>
  <text x="747" y="545" class="l">읽은 원문</text>
  <path class="e" d="M1345 400 V616" marker-end="url(#a)"/>
  <path class="e" d="M1080 685 H1146" marker-end="url(#a)"/>

  <path class="ea" d="M1345 750 V812 H34 V325 H56" marker-end="url(#ac)"/>
  <text x="760" y="840" text-anchor="middle" fill="#e8a24a" font-size="14">마음에 든 방향을 큐에 담으면 다음 밤 디깅의 출발점이 된다</text>
</svg>
