  <text class="s" x="1160" y="750">"왜 이걸 골랐어?"</text>
  <text class="s" x="1160" y="772">원문을 인용해 답</text>
  <rect x="1264" y="702" width="52" height="20" rx="10" fill="#14281f"/><text x="1290" y="716" text-anchor="middle" class="chip-t" fill="#5fbf8f">LOCAL</text>

  <rect class="n" x="1350" y="690" width="190" height="104" rx="10"/>
  <text class="t" x="1370" y="724">웹 앱</text>
