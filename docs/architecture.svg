  <path class="e" d="M280 372 H310 V262 H336" marker-end="url(#a)"/>
  <path class="e" d="M450 284 V326" marker-end="url(#a)"/>
  <path d="M560 372 H636" stroke="#e8a24a" stroke-width="1.6" fill="none" marker-end="url(#ac)"/>
